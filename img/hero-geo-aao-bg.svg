<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="GEO and AAO dual system dark background">
  <defs>
    <radialGradient id="void" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#0c1520"/>
      <stop offset="42%" stop-color="#080e16"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>
    <radialGradient id="geoAura" cx="32%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#2a5568" stop-opacity=".34"/>
      <stop offset="45%" stop-color="#1b3a4b" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#1b3a4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aaoAura" cx="68%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#a85a35" stop-opacity=".30"/>
      <stop offset="45%" stop-color="#8a3f1f" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#8a3f1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="48%" r="22%">
      <stop offset="0%" stop-color="#e0a385" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#c4a574" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a5568" stop-opacity="0"/>
      <stop offset="22%" stop-color="#2a5568" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#c4a574" stop-opacity=".72"/>
      <stop offset="78%" stop-color="#a85a35" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a85a35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="askFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fb5cc" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7fb5cc" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="ansFlow" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#d9a485" stop-opacity="0"/>
      <stop offset="40%" stop-color="#d9a485" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="mesh" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#c4a574" stroke-width=".45" opacity=".045"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="68%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070b" stop-opacity=".72"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#void)"/>
  <rect width="1920" height="1080" fill="url(#geoAura)"/>
  <rect width="1920" height="1080" fill="url(#aaoAura)"/>
  <rect width="1920" height="1080" fill="url(#mesh)"/>
  <rect width="1920" height="1080" fill="url(#core)"/>

  <g opacity=".78">
    <circle cx="620" cy="520" r="390" fill="none" stroke="#2a5568" stroke-width="1.4" opacity=".55"/>
    <circle cx="620" cy="520" r="402" fill="none" stroke="#2a5568" stroke-width=".5" opacity=".22"/>
    <circle cx="620" cy="520" r="318" fill="#1b3a4b" fill-opacity=".05" stroke="#7fb5cc" stroke-width=".7" opacity=".35"/>
  </g>

  <g opacity=".78">
    <circle cx="1300" cy="520" r="390" fill="none" stroke="#a85a35" stroke-width="1.4" opacity=".55"/>
    <circle cx="1300" cy="520" r="402" fill="none" stroke="#a85a35" stroke-width=".5" opacity=".22"/>
    <circle cx="1300" cy="520" r="318" fill="#8a3f1f" fill-opacity=".05" stroke="#d9a485" stroke-width=".7" opacity=".35"/>
  </g>

  <g>
    <circle cx="960" cy="520" r="148" fill="url(#core)"/>
    <circle cx="960" cy="520" r="96" fill="#081018" fill-opacity=".55" stroke="#c4a574" stroke-width="1.6" opacity=".7"/>
    <circle cx="960" cy="520" r="108" fill="none" stroke="#ecd9b8" stroke-width=".5" opacity=".28"/>
  </g>

  <g fill="none" stroke="url(#askFlow)" stroke-width="1.6">
    <path d="M40 860 C 220 820, 380 760, 520 700 C 640 650, 760 580, 900 540" opacity=".7"/>
    <path d="M70 920 C 260 870, 420 800, 560 740 C 700 680, 820 600, 930 555" opacity=".35" stroke-dasharray="5 9"/>
  </g>

  <g fill="none" stroke="url(#ansFlow)" stroke-width="1.6">
    <path d="M1020 540 C 1160 580, 1280 650, 1400 700 C 1540 760, 1700 820, 1880 860" opacity=".7"/>
    <path d="M990 555 C 1130 600, 1260 680, 1400 740 C 1540 800, 1680 870, 1850 920" opacity=".35" stroke-dasharray="5 9"/>
  </g>

  <path d="M620 520 C 740 480, 840 480, 960 520 C 1080 560, 1180 560, 1300 520"
        fill="none" stroke="url(#bridge)" stroke-width="2.2" opacity=".55"/>

  <g filter="url(#soft)">
    <g fill="#7fb5cc">
      <circle cx="360" cy="300" r="4.5" opacity=".85"/><circle cx="280" cy="460" r="3.5" opacity=".7"/>
      <circle cx="340" cy="640" r="4" opacity=".8"/><circle cx="480" cy="250" r="3.2" opacity=".65"/>
      <circle cx="520" cy="700" r="4" opacity=".75"/><circle cx="420" cy="520" r="3.5" opacity=".7"/>
      <circle cx="240" cy="360" r="3" opacity=".6"/><circle cx="560" cy="360" r="4" opacity=".8"/>
      <circle cx="300" cy="180" r="2.6" opacity=".55"/><circle cx="200" cy="560" r="3" opacity=".6"/>
    </g>
    <g stroke="#2a5568" stroke-width=".7" opacity=".28" fill="none">
      <path d="M360,300 L480,250 L560,360 L420,520 L520,700 L340,640 L280,460 L240,360 L360,300"/>
      <path d="M280,460 L200,560 M420,520 L560,360 M300,180 L360,300"/>
    </g>
  </g>

  <g filter="url(#soft)">
    <g fill="#d9a485">
      <circle cx="1560" cy="300" r="4.5" opacity=".85"/><circle cx="1640" cy="460" r="3.5" opacity=".7"/>
      <circle cx="1580" cy="640" r="4" opacity=".8"/><circle cx="1440" cy="250" r="3.2" opacity=".65"/>
      <circle cx="1400" cy="700" r="4" opacity=".75"/><circle cx="1500" cy="520" r="3.5" opacity=".7"/>
      <circle cx="1680" cy="360" r="3" opacity=".6"/><circle cx="1360" cy="360" r="4" opacity=".8"/>
      <circle cx="1620" cy="180" r="2.6" opacity=".55"/><circle cx="1720" cy="560" r="3" opacity=".6"/>
    </g>
    <g stroke="#a85a35" stroke-width=".7" opacity=".28" fill="none">
      <path d="M1560,300 L1440,250 L1360,360 L1500,520 L1400,700 L1580,640 L1640,460 L1680,360 L1560,300"/>
      <path d="M1640,460 L1720,560 M1500,520 L1360,360 M1620,180 L1560,300"/>
    </g>
  </g>

  <g font-family="Noto Sans SC, PingFang SC, sans-serif" text-anchor="middle" fill="#9ec4d4" opacity=".22" letter-spacing="3">
    <text x="360" y="284" font-size="13">Doubao</text>
    <text x="560" y="348" font-size="13">Tongyi</text>
    <text x="340" y="668" font-size="13">Yuanbao</text>
    <text x="240" y="348" font-size="12">Kimi</text>
  </g>

  <g font-family="Noto Sans SC, PingFang SC, sans-serif" text-anchor="middle" fill="#e0b896" opacity=".22" letter-spacing="3">
    <text x="1560" y="284" font-size="13">Price</text>
    <text x="1360" y="348" font-size="13">Scope</text>
    <text x="1580" y="668" font-size="13">Credential</text>
    <text x="1680" y="348" font-size="12">Brand</text>
  </g>

  <g font-family="Noto Serif SC, Cormorant Garamond, Georgia, serif" text-anchor="middle">
    <text x="620" y="128" font-size="54" font-weight="700" fill="#7fb5cc" opacity=".18" letter-spacing="10">GEO</text>
    <text x="620" y="162" font-size="15" fill="#6f9aad" opacity=".28" letter-spacing="4">Mentioned · Seen</text>
    <text x="1300" y="128" font-size="54" font-weight="700" fill="#d9a485" opacity=".18" letter-spacing="10">AAO</text>
    <text x="1300" y="162" font-size="15" fill="#b8835f" opacity=".28" letter-spacing="4">Correct · Understood</text>
    <text x="960" y="514" font-size="26" font-weight="700" fill="#ecd9b8" opacity=".55">One System</text>
    <text x="960" y="542" font-size="12" fill="#a8946a" opacity=".42" letter-spacing="4">GEO x AAO</text>
  </g>

  <path d="M760 210 Q 960 150 1160 210" fill="none" stroke="#dfe7f2" stroke-width="1.1" opacity=".22"/>
  <text x="960" y="188" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#cfd9e6" opacity=".28" letter-spacing="6">Seen First</text>

  <path d="M760 860 Q 960 920 1160 860" fill="none" stroke="#d8c4a0" stroke-width="1.1" opacity=".22"/>
  <text x="960" y="898" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#d8c4a0" opacity=".28" letter-spacing="4">Human Confirms Corrections</text>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
