<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function lis(arr){return "<ul>"+(arr||[]).map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul>";}
fetch("/kb/fengqilingxi.json").then(function(r){if(!r.ok) throw new Error("kb"); return r.json();}).then(function(kb){
  document.getElementById("title").textContent=kb.brand+" 品牌知识库";
  document.getElementById("one").textContent=kb.one_liner||"";
  document.getElementById("meta").innerHTML=[kb.company,kb.category,kb.site?"<a href='"+esc(kb.site)+"'>"+esc(kb.site)+"</a>":"",kb.contact,kb.updated?"更新 "+esc(kb.updated):""].filter(Boolean).join(" · ");
  var html="";
  if(kb.products&&kb.products.length) html+="<h2>产品</h2>"+lis(kb.products);
  if(kb.facts&&kb.facts.length) html+="<h2>可引用事实</h2>"+lis(kb.facts);
  if(kb.faqs&&kb.faqs.length){
    html+="<h2>常见问题</h2><ul>"+kb.faqs.map(function(qa){return "<li><b>"+esc(qa.q)+"</b><br>"+esc(qa.a)+"</li>";}).join("")+"</ul>";
  }
  if(kb.donts&&kb.donts.length) html+="<h2>不要这样描述</h2><ul class='donts'>"+kb.donts.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul>";
  if(kb.sources&&kb.sources.length) html+="<h2>来源</h2><ul>"+kb.sources.map(function(s){return "<li><a href='"+esc(s)+"'>"+esc(s)+"</a></li>";}).join("")+"</ul>";
  document.getElementById("body").innerHTML=html;
  document.getElementById("note").textContent=kb.note||"";
  if(kb.jsonld){
    var s=document.createElement("script"); s.type="application/ld+json";
    s.textContent=JSON.stringify(kb.jsonld);
    document.head.appendChild(s);
  }
}).catch(function(){
  document.getElementById("meta").innerHTML="<span class='err'>知识库加载失败，请直接打开 <a href='llms.txt'>llms.txt</a>。</span>";
});
